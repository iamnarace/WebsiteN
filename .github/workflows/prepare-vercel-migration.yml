name: Prepare 1Touch IT for Vercel

on:
  push:
    branches:
      - migration/1touchit-domain
    paths:
      - .github/workflows/prepare-vercel-migration.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/1touchit-domain
          fetch-depth: 0

      - name: Update business domain, email and founder links
        shell: python
        run: |
          from pathlib import Path
          import json

          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8-sig")

          # Move every business-owned URL to the new 1Touch IT domain.
          html = html.replace(
              "https://nareshadhikari.com.au",
              "https://www.1touchit.com.au",
          )

          # The business website uses one public mailbox only.
          html = html.replace(
              "nareshadhikari06@gmail.com",
              "support@1touchit.com.au",
          )

          # Founder/resume actions now open the separate personal website.
          html = html.replace(
              "go('resume')",
              "window.open('https://nareshadhikari.com.au','_blank')",
          )
          html = html.replace(
              'go("resume")',
              "window.open('https://nareshadhikari.com.au','_blank')",
          )
          html = html.replace(
              'href="resume.html"',
              'href="https://nareshadhikari.com.au" target="_blank" rel="noopener"',
          )

          index_path.write_text(html, encoding="utf-8")

          Path("robots.txt").write_text(
              "User-agent: *\nAllow: /\n\nSitemap: https://www.1touchit.com.au/sitemap.xml\n",
              encoding="utf-8",
          )

          Path("sitemap.xml").write_text(
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              '  <url><loc>https://www.1touchit.com.au/</loc><changefreq>monthly</changefreq><priority>1.0</priority></url>\n'
              '</urlset>\n',
              encoding="utf-8",
          )

          vercel = {
              "cleanUrls": False,
              "trailingSlash": False,
              "headers": [
                  {
                      "source": "/(.*)",
                      "headers": [
                          {"key": "X-Content-Type-Options", "value": "nosniff"},
                          {"key": "Referrer-Policy", "value": "strict-origin-when-cross-origin"},
                          {"key": "Permissions-Policy", "value": "camera=(), microphone=(), geolocation=()"},
                      ],
                  }
              ],
          }
          Path("vercel.json").write_text(
              json.dumps(vercel, indent=2) + "\n",
              encoding="utf-8",
          )

      - name: Validate migration output
        shell: python
        run: |
          from pathlib import Path
          import json

          html = Path("index.html").read_text(encoding="utf-8")
          assert '<meta property="og:url" content="https://www.1touchit.com.au/">' in html
          assert '"url": "https://www.1touchit.com.au/"' in html
          assert "support@1touchit.com.au" in html
          assert "nareshadhikari06@gmail.com" not in html
          assert "window.open('https://nareshadhikari.com.au','_blank')" in html
          assert "https://www.1touchit.com.au/sitemap.xml" in Path("robots.txt").read_text()
          assert "https://www.1touchit.com.au/" in Path("sitemap.xml").read_text()
          json.loads(Path("vercel.json").read_text())

      - name: Commit prepared Vercel configuration
        shell: bash
        run: |
          if git diff --quiet && git status --porcelain | grep -qv '^??'; then
            echo "No migration changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html robots.txt sitemap.xml vercel.json
          git commit -m "feat: prepare 1Touch IT for Vercel and new domain"
          git push origin migration/1touchit-domain
